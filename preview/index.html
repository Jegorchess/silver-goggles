<!doctype html>
<html lang="uk">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>KinoBattle Preview</title>
<!--
  Інтерактивний макет iOS-застосунку для перегляду на Windows (у VS Code Simple Browser).
  Ігрова логіка — у ../shared/engine.js (порт KinoBattleApp/Engine/*.swift), спільна з онлайн-сервером.
  Цю сторінку роздає server/server.js; гра з людиною йде через його WebSocket /ws.
-->
<style>
  :root {
    --bg: #1b1b22;
    --screen: #0d0d14;
    --card: #1c1c28;
    --card-hi: #262636;
    --text: #f4f4f8;
    --muted: #9a9ab0;
    --accent: #ff4d6d;
    --gold: #ffc94d;
    --good: #2fd27a;
    --bad: #ff5a5a;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100%; }
  body {
    background: var(--bg);
    font-family: -apple-system, "SF Pro Display", "Segoe UI", system-ui, sans-serif;
    color: var(--text);
    display: flex; align-items: center; justify-content: center;
    overflow: hidden;
  }
  #stage { width: 390px; height: 844px; transform-origin: center; flex: none; }
  .phone {
    position: relative; width: 390px; height: 844px;
    border-radius: 56px; background: var(--screen);
    box-shadow: 0 0 0 11px #2c2c33, 0 0 0 13px #4a4a55, 0 30px 80px rgba(0,0,0,.6);
    overflow: hidden;
  }
  .island {
    position: absolute; top: 11px; left: 50%; transform: translateX(-50%);
    width: 122px; height: 35px; border-radius: 20px; background: #000; z-index: 10;
  }
  .statusbar {
    position: absolute; top: 0; left: 0; right: 0; height: 54px; z-index: 9;
    display: flex; justify-content: space-between; align-items: center;
    padding: 6px 34px 0; font-size: 16px; font-weight: 600;
  }
  .homebar {
    position: absolute; bottom: 8px; left: 50%; transform: translateX(-50%);
    width: 134px; height: 5px; border-radius: 3px; background: rgba(255,255,255,.85); z-index: 10;
  }
  .screen { position: absolute; inset: 54px 0 34px; display: flex; flex-direction: column; padding: 12px 20px 16px; }
  .hidden { display: none !important; }

  button, input {
    font: inherit; color: inherit; border: none;
    -webkit-tap-highlight-color: transparent;
  }
  button { cursor: pointer; }
  .btn {
    width: 100%; padding: 17px; border-radius: 16px; font-size: 18px; font-weight: 700;
    background: var(--accent); color: #fff; transition: transform .08s, opacity .15s;
  }
  .btn:active:not(:disabled) { transform: scale(.97); }
  .btn:disabled { opacity: .5; cursor: default; }
  .btn.secondary { background: var(--card-hi); }
  .field {
    width: 100%; padding: 15px 16px; border-radius: 14px; background: var(--card);
    font-size: 17px; outline: none; box-shadow: inset 0 0 0 1px transparent; transition: box-shadow .15s;
  }
  .field:focus { box-shadow: inset 0 0 0 2px var(--accent); }
  .field::placeholder { color: var(--muted); }
  .field-label { font-size: 13px; color: var(--muted); margin: 0 0 6px 4px; text-align: left; }

  /* Головний */
  #home { justify-content: space-between; text-align: center; }
  .logo {
    margin: 28px auto 0; width: 104px; height: 104px; border-radius: 27px;
    /* Світіння — того ж кольору, що кнопка «Грати» і слово «Battle» (--accent). */
    --glow: rgba(255, 77, 109, .45);
    --glow-strong: rgba(255, 77, 109, .65);
    box-shadow: 0 14px 40px var(--glow), 0 0 0 1px rgba(255,255,255,.08);
    animation: breathe 3.2s ease-in-out infinite;
  }
  .logo svg { display: block; width: 100%; height: 100%; }
  @keyframes breathe {
    0%, 100% { transform: translateY(0); box-shadow: 0 14px 40px var(--glow), 0 0 0 1px rgba(255,255,255,.08); }
    50% { transform: translateY(-5px); box-shadow: 0 20px 56px var(--glow-strong), 0 0 0 1px rgba(255,255,255,.10); }
  }
  @media (prefers-reduced-motion: reduce) { .logo { animation: none; } }
  .title { font-size: 34px; font-weight: 800; letter-spacing: -.5px; margin-top: 16px; }
  .title span { color: var(--accent); }
  .subtitle { color: var(--muted); margin-top: 6px; font-size: 16px; line-height: 1.4; }
  .rules { background: var(--card); border-radius: 18px; padding: 14px 18px; text-align: left; font-size: 15px; line-height: 1.65; color: var(--muted); }
  .rules b { color: var(--text); font-weight: 600; }
  .home-controls { display: flex; flex-direction: column; gap: 10px; }
  .segmented { display: flex; background: var(--card); border-radius: 14px; padding: 4px; }
  .segmented button { flex: 1; padding: 11px 0; border-radius: 10px; background: transparent; color: var(--muted); font-size: 15px; font-weight: 600; transition: background .15s, color .15s; }
  .segmented button.on { background: var(--card-hi); color: var(--text); }
  .play-row { display: flex; gap: 10px; }
  .play-row .btn { font-size: 16px; padding: 16px 8px; }

  /* Лобі */
  #lobby { gap: 12px; }
  .back { align-self: flex-start; background: none; color: var(--accent); font-size: 17px; font-weight: 600; padding: 6px 0; }
  .lobby-title { font-size: 30px; font-weight: 800; margin-top: 4px; }
  .lobby-sub { color: var(--muted); font-size: 15px; margin-top: -4px; }
  .lobby-menu { display: flex; flex-direction: column; gap: 12px; margin-top: 18px; }
  .divider { display: flex; align-items: center; gap: 10px; color: var(--muted); font-size: 13px; margin: 6px 0; }
  .divider::before, .divider::after { content: ""; flex: 1; height: 1px; background: var(--card-hi); }
  .join-row { display: flex; gap: 10px; }
  .join-row .field { flex: 1; text-transform: uppercase; letter-spacing: 6px; font-weight: 700; text-align: center; font-size: 20px; }
  .join-row .field::placeholder { letter-spacing: 2px; font-weight: 500; font-size: 17px; }
  .join-row .btn { width: auto; padding: 15px 22px; font-size: 17px; }
  .lobby-wait { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center; gap: 18px; }
  .spinner { width: 54px; height: 54px; border-radius: 50%; border: 5px solid var(--card-hi); border-top-color: var(--accent); animation: spin 1s linear infinite; }
  @keyframes spin { to { transform: rotate(360deg); } }
  .wait-text { font-size: 19px; font-weight: 600; }
  .wait-hint { color: var(--muted); font-size: 15px; line-height: 1.4; max-width: 290px; }
  .room-code { font-size: 54px; font-weight: 800; letter-spacing: 12px; padding: 10px 14px 10px 26px; border-radius: 18px; background: var(--card); color: var(--gold); font-variant-numeric: tabular-nums; }
  .lobby-wait .btn { max-width: 300px; }
  .status { min-height: 20px; text-align: center; color: var(--bad); font-size: 14px; line-height: 1.4; }

  /* Матч */
  .scorebar { display: flex; align-items: center; justify-content: space-between; gap: 8px; }
  .player { display: flex; align-items: center; gap: 10px; min-width: 0; flex: 1; }
  .player.right { flex-direction: row-reverse; text-align: right; }
  .player .ava { font-size: 26px; width: 46px; height: 46px; border-radius: 50%; background: var(--card); display: grid; place-items: center; flex: none; position: relative; }
  .player .ava .tick {
    position: absolute; right: -3px; bottom: -3px; width: 20px; height: 20px; border-radius: 50%;
    background: var(--good); color: #000; font-size: 12px; font-weight: 800; display: grid; place-items: center;
  }
  .player .name { font-size: 13px; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .player .score { font-size: 22px; font-weight: 800; font-variant-numeric: tabular-nums; }
  .counter { font-size: 14px; font-weight: 700; color: var(--muted); background: var(--card); padding: 6px 12px; border-radius: 12px; flex: none; }
  .counter.final { color: #000; background: var(--gold); }

  .timer { margin-top: 18px; display: flex; align-items: center; gap: 10px; }
  .timer .track { flex: 1; height: 8px; border-radius: 4px; background: var(--card); overflow: hidden; }
  .timer .fill { height: 100%; width: 100%; background: var(--good); border-radius: 4px; }
  .timer .num { width: 30px; text-align: right; font-weight: 700; font-variant-numeric: tabular-nums; }

  .question { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center; padding: 10px 4px; }
  .question .hint { color: var(--gold); font-weight: 700; font-size: 15px; text-transform: uppercase; letter-spacing: 1px; margin-bottom: 12px; }
  .question .prompt { font-size: 24px; font-weight: 700; line-height: 1.3; }
  .question .prompt.emoji { font-size: 64px; letter-spacing: 6px; }

  .fact {
    position: relative; overflow: hidden; width: 100%; margin-top: 18px; padding: 14px 16px 16px;
    border-radius: 16px; background: var(--card); text-align: left; cursor: pointer;
    box-shadow: inset 0 0 0 1px rgba(255, 201, 77, .25);
    animation: pop .3s ease-out both;
  }
  .fact .label { color: var(--gold); font-size: 13px; font-weight: 700; text-transform: uppercase; letter-spacing: .8px; }
  .fact .text { margin-top: 6px; font-size: 15px; line-height: 1.45; }
  .fact .skip { margin-top: 8px; font-size: 12px; color: var(--muted); }
  .fact .bar { position: absolute; left: 0; bottom: 0; height: 3px; width: 100%; background: var(--gold); transform-origin: left; }
  .question.revealing .prompt { font-size: 19px; }
  .question.revealing .prompt.emoji { font-size: 44px; }
  .question.revealing .hint { display: none; }

  .options { display: flex; flex-direction: column; gap: 10px; min-height: 278px; }
  .opt {
    position: relative; text-align: left; padding: 17px 18px; border-radius: 16px;
    background: var(--card); font-size: 17px; font-weight: 600;
    border: 2px solid transparent; transition: background .15s, border-color .15s, opacity .15s, transform .08s;
    animation: pop .25s ease-out both;
  }
  .opt:nth-child(2) { animation-delay: .04s; } .opt:nth-child(3) { animation-delay: .08s; } .opt:nth-child(4) { animation-delay: .12s; }
  .opt:active:not(:disabled) { transform: scale(.98); }
  .opt:disabled { cursor: default; }
  .opt.picked { border-color: var(--text); background: var(--card-hi); }
  .opt.correct { background: rgba(47,210,122,.18); border-color: var(--good); }
  .opt.wrong { background: rgba(255,90,90,.16); border-color: var(--bad); }
  .opt.dim { opacity: .45; }
  .opt .marks { position: absolute; right: 12px; top: 50%; transform: translateY(-50%); display: flex; gap: 4px; }
  .opt .marks span { width: 28px; height: 28px; border-radius: 50%; background: var(--screen); display: grid; place-items: center; font-size: 15px; }
  @keyframes pop { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: none; } }

  .gain { position: absolute; font-weight: 800; font-size: 18px; color: var(--good); animation: rise 1.4s ease-out forwards; pointer-events: none; }
  @keyframes rise { 0% { opacity: 0; transform: translateY(6px); } 20% { opacity: 1; } 100% { opacity: 0; transform: translateY(-24px); } }

  .banner {
    position: absolute; inset: 0; z-index: 5; display: grid; place-items: center; text-align: center;
    background: rgba(13,13,20,.92); animation: fade .2s ease-out;
  }
  .banner div { font-size: 34px; font-weight: 800; line-height: 1.2; }
  .banner b { display: block; color: var(--gold); font-size: 64px; margin-top: 6px; }
  @keyframes fade { from { opacity: 0; } }

  /* Результат */
  #result { text-align: center; justify-content: space-between; }
  .verdict-emoji { font-size: 84px; margin-top: 50px; }
  .verdict { font-size: 38px; font-weight: 800; margin-top: 6px; }
  .verdict.win { color: var(--gold); } .verdict.loss { color: var(--bad); } .verdict.draw { color: var(--muted); }
  .verdict-note { color: var(--muted); font-size: 15px; margin-top: 6px; min-height: 20px; }
  .final-scores { display: flex; gap: 12px; margin-top: 24px; }
  .final-scores .col { flex: 1; min-width: 0; background: var(--card); border-radius: 18px; padding: 18px 10px; }
  .final-scores .col.winner { box-shadow: inset 0 0 0 2px var(--gold); }
  .final-scores .ava { font-size: 36px; }
  .final-scores .nm { color: var(--muted); font-size: 14px; margin-top: 4px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .final-scores .pts { font-size: 30px; font-weight: 800; margin-top: 6px; font-variant-numeric: tabular-nums; }
  .final-scores .cr { color: var(--muted); font-size: 14px; margin-top: 2px; }
  .actions { display: flex; flex-direction: column; gap: 10px; }
  .rematch-note { color: var(--gold); font-size: 15px; font-weight: 600; min-height: 20px; }

  .error { margin: auto; text-align: center; color: var(--muted); line-height: 1.5; }
  .error b { color: var(--bad); display: block; font-size: 18px; margin-bottom: 8px; }
</style>
</head>
<body>

  <div class="phone">

    <div class="statusbar"><span id="clock">9:41</span><span>📶 🔋</span></div>

    <section id="home" class="screen">
      <div>

          <!-- Логотип: хлопавка з блискавкою («кіно» + «батл»). Основа для майбутньої AppIcon. -->

<script src="../shared/engine.js"></script>
<script>
const { MatchRules, Match, makeBot, pickQuestions, updateRecent } = window.KinoEngine;

// ===== Збереження (лише зручності конкретного браузера) =====
const store = {
  get(key, fallback) { try { const v = localStorage.getItem(key); return v == null ? fallback : JSON.parse(v); } catch { return fallback; } },
  set(key, value) { try { localStorage.setItem(key, JSON.stringify(value)); } catch {} },
};
const RECENT_KEY = 'kinobattle.recent';
const LENGTH_KEY = 'kinobattle.matchLength';
const NAME_KEY = 'kinobattle.name';

// ===== Стан =====
const $ = id => document.getElementById(id);
let bank = [];
let matchLength = MatchRules.matchLengths.includes(store.get(LENGTH_KEY)) ? store.get(LENGTH_KEY) : MatchRules.questionsPerMatch;
/** Поточна гра: { kind: 'bot' | 'online', send(msg), close() }. */
let session = null;
let ws = null;
/** Таймери поточного екрана матчу — скасовуються при переході між питаннями. */
const ui = { timers: [], raf: 0, total: 7, opponentIsBot: true, answered: false, lobbyTimer: 0 };

function myName() {
  const v = $('name-input').value.replace(/\s+/g, ' ').trim();
  return v || 'Гравець';
}

function show(screen) {
  for (const id of ['home', 'lobby', 'match', 'result']) $(id).classList.toggle('hidden', id !== screen);
}

function uiLater(fn, ms) { ui.timers.push(setTimeout(fn, ms)); }
function clearUi() {
  ui.timers.forEach(clearTimeout);
  ui.timers = [];
  cancelAnimationFrame(ui.raf);
}

function endSession() {
  clearUi();
  clearTimeout(ui.lobbyTimer);
  if (session) session.close();
  session = null;
}

// ===== Гра з ботом: той самий Match, що й на сервері, але локально =====
function startBotMatch() {
  endSession();
  const recent = store.get(RECENT_KEY, []);
  const questions = pickQuestions(bank, matchLength, recent);
  store.set(RECENT_KEY, updateRecent(recent, questions));
  const me = { name: myName(), avatar: '🎬', send: msg => onMessage(msg) };
  const match = new Match({ questions, players: [me, makeBot()] });
  const s = {
    kind: 'bot',
    send(msg) {
      if (session !== s) return;
      if (msg.t === 'answer') match.answer(0, msg.index, msg.option);
      else if (msg.t === 'skip') match.skip(0, msg.index);
      else if (msg.t === 'rematch') startBotMatch();
    },
    close() { match.abort(); },
  };
  session = s;
  match.start();
}

// ===== Гра з людиною: WebSocket до server/server.js =====
function connect() {
  if (ws && ws.readyState === WebSocket.OPEN) return Promise.resolve(ws);
  if (location.protocol === 'file:') return Promise.reject(new Error('file'));
  return new Promise((resolve, reject) => {
    const sock = new WebSocket(`${location.protocol === 'https:' ? 'wss' : 'ws'}://${location.host}/ws`);
    sock.onopen = () => { ws = sock; resolve(sock); };
    sock.onerror = () => reject(new Error('ws'));
    sock.onclose = () => { if (ws === sock) { ws = null; onDisconnect(); } };
    sock.onmessage = e => {
      let msg;
      try { msg = JSON.parse(e.data); } catch { return; }
      if (session && session.kind === 'online') onMessage(msg);
    };
  });
}

async function goOnline(msg) {
  endSession();
  $('lobby-status').textContent = '';
  let sock;
  try {
    sock = await connect();
  } catch {
    showLobbyMenu();
    $('lobby-status').textContent = 'Немає звʼязку з сервером. Запусти його: завдання VS Code «Preview: запустити сервер» (node server/server.js).';
    return;
  }
  const s = {
    kind: 'online',
    send(m) { if (sock.readyState === WebSocket.OPEN) sock.send(JSON.stringify(m)); },
    close() { this.send({ t: 'leave' }); },
  };
  session = s;
  s.send({ t: 'hello', name: myName() });
  s.send(msg);
}

function onDisconnect() {
  if (!session || session.kind !== 'online') return;
  session = null;
  clearUi();
  clearTimeout(ui.lobbyTimer);
  show('lobby');
  showLobbyMenu();
  $('lobby-status').textContent = 'Звʼязок із сервером втрачено.';
}

// ===== Лобі =====
function showLobby() {
  $('lobby-sub').textContent = `${matchLength} питань · граєш як «${myName()}»`;
  $('lobby-status').textContent = '';
  showLobbyMenu();
  show('lobby');
}

function showLobbyMenu() {
  clearTimeout(ui.lobbyTimer);
  $('lobby-menu').classList.remove('hidden');
  $('lobby-wait').classList.add('hidden');
  $('lobby-back').classList.remove('hidden');
}

function showLobbyWait({ text, hint = '', code = null }) {
  $('lobby-menu').classList.add('hidden');
  $('lobby-wait').classList.remove('hidden');
  $('lobby-back').classList.add('hidden');
  $('wait-text').textContent = text;
  $('wait-hint').textContent = hint;
  $('room-code').classList.toggle('hidden', !code);
  $('room-code').textContent = code || '';
  $('bot-instead').classList.add('hidden');
}

// ===== Повідомлення матчу (однакові від локального Match і від сервера) =====
const handlers = {
  queued() {
    showLobbyWait({ text: 'Шукаємо суперника…', hint: `Матч на ${matchLength} питань` });
    clearTimeout(ui.lobbyTimer);
    ui.lobbyTimer = setTimeout(() => {
      $('wait-hint').textContent = 'Поки нікого немає. Можна зачекати ще або зіграти з ботом.';
      $('bot-instead').classList.remove('hidden');
    }, 20000);
  },

  room(m) {
    showLobbyWait({ text: 'Кімнату створено', code: m.code, hint: `Скажи другу цей код — він вводить його в «Гра з людиною». Матч на ${m.length} питань.` });
  },

  error(m) {
    if (!$('lobby').classList.contains('hidden')) {
      showLobbyMenu();
      $('lobby-status').textContent = m.message;
    }
  },

  start(m) {
    clearTimeout(ui.lobbyTimer);
    clearUi();
    ui.total = m.total;
    ui.opponentIsBot = m.opponent.isBot;
    $('me-ava').textContent = m.you.avatar;
    $('me-name').textContent = 'Ти';
    $('opp-ava').textContent = m.opponent.avatar;
    $('opp-name').textContent = m.opponent.name;
    $('me-score').textContent = '0';
    $('opp-score').textContent = '0';
    for (const [col, p, nm] of [['res-me', m.you, 'Ти'], ['res-opp', m.opponent, m.opponent.name]]) {
      $(col).querySelector('.ava').textContent = p.avatar;
      $(col).querySelector('.nm').textContent = nm;
    }
    $('options').innerHTML = '';
    $('prompt').textContent = '';
    $('fact').classList.add('hidden');
    show('match');
  },

  question(m) {
    clearUi();
    const isFinal = m.multiplier > 1;
    $('counter').textContent = isFinal ? 'Фінал ×2' : `${m.index + 1}/${m.total}`;
    $('counter').classList.toggle('final', isFinal);
    $('me-tick').classList.add('hidden');
    $('opp-tick').classList.add('hidden');
    $('options').innerHTML = '';
    $('fact').classList.add('hidden');
    $('question').classList.remove('revealing');
    setTimer(MatchRules.questionTime);
    const showPrompt = () => {
      $('banner').classList.add('hidden');
      const isEmoji = m.type === 'emoji';
      $('hint').classList.toggle('hidden', !isEmoji);
      $('prompt').classList.toggle('emoji', isEmoji);
      $('prompt').textContent = m.prompt;
    };
    if (isFinal) {
      $('prompt').textContent = '';
      $('hint').classList.add('hidden');
      $('banner').classList.remove('hidden');
      uiLater(showPrompt, MatchRules.finalBannerDuration * 1000);
    } else {
      showPrompt();
    }
  },

  options(m) {
    ui.answered = false;
    const box = $('options');
    box.innerHTML = '';
    m.options.forEach((text, i) => {
      const b = document.createElement('button');
      b.className = 'opt';
      b.innerHTML = '<span></span><span class="marks"></span>';
      b.firstChild.textContent = text;
      b.onclick = () => {
        if (ui.answered) return;
        ui.answered = true;
        b.classList.add('picked');
        for (const x of box.children) x.disabled = true;
        session?.send({ t: 'answer', index: m.index, option: i });
      };
      box.appendChild(b);
    });
    // Відлік лише для показу; час відповіді міряє матч (на сервері — сервер).
    const start = performance.now();
    const frame = () => {
      const left = m.time - (performance.now() - start) / 1000;
      setTimer(left);
      if (left > 0) ui.raf = requestAnimationFrame(frame);
    };
    ui.raf = requestAnimationFrame(frame);
  },

  answerAccepted() { $('me-tick').classList.remove('hidden'); },
  opponentAnswered() { $('opp-tick').classList.remove('hidden'); },

  reveal(m) {
    cancelAnimationFrame(ui.raf);
    [...$('options').children].forEach((b, i) => {
      b.disabled = true;
      b.classList.remove('picked');
      const marks = b.querySelector('.marks');
      if (m.you.option === i) marks.insertAdjacentHTML('beforeend', `<span>${$('me-ava').textContent}</span>`);
      if (m.opponent.option === i) marks.insertAdjacentHTML('beforeend', `<span>${$('opp-ava').textContent}</span>`);
      if (i === m.correctIndex) b.classList.add('correct');
      else if (m.you.option === i || m.opponent.option === i) b.classList.add('wrong');
      else b.classList.add('dim');
    });
    $('me-score').textContent = m.you.score;
    $('opp-score').textContent = m.opponent.score;
    floatGain($('me-score'), m.you.points);
    floatGain($('opp-score'), m.opponent.points);

    if (m.fact) {
      $('fact-text').textContent = m.fact;
      $('fact-skip').textContent = 'Торкніться, щоб продовжити';
      $('question').classList.add('revealing');
      const card = $('fact');
      card.classList.remove('hidden');
      const bar = $('fact-bar');
      bar.style.transition = 'none';
      bar.style.transform = 'scaleX(1)';
      void bar.offsetWidth; // перезапуск анімації
      bar.style.transition = `transform ${m.duration * 1000}ms linear`;
      bar.style.transform = 'scaleX(0)';
      card.onclick = () => {
        card.onclick = null;
        if (!ui.opponentIsBot) $('fact-skip').textContent = 'Чекаємо на суперника…';
        session?.send({ t: 'skip', index: m.index });
      };
    }
  },

  opponentReady() {
    if (!$('fact').classList.contains('hidden') && $('fact').onclick) $('fact-skip').textContent = 'Суперник готовий — торкніться, щоб продовжити';
  },

  end(m) {
    clearUi();
    $('banner').classList.add('hidden');
    const left = m.reason === 'opponentLeft';
    const text = left ? ['🏆', 'Перемога!'] : { win: ['🏆', 'Перемога!'], loss: ['😤', 'Поразка'], draw: ['🤝', 'Нічия'] }[m.outcome];
    $('verdict-emoji').textContent = text[0];
    $('verdict').textContent = text[1];
    $('verdict').className = `verdict ${m.outcome}`;
    $('verdict-note').textContent = left ? 'Суперник вийшов з матчу' : '';
    const fill = (id, p, isWinner) => {
      $(id).querySelector('.pts').textContent = p.score;
      $(id).querySelector('.cr').textContent = `${p.correct} з ${m.total} правильно`;
      $(id).classList.toggle('winner', isWinner);
    };
    fill('res-me', m.you, m.outcome === 'win');
    fill('res-opp', m.opponent, m.outcome === 'loss');
    $('rematch').disabled = left;
    $('rematch').textContent = 'Реванш';
    $('rematch-note').textContent = '';
    show('result');
  },

  rematchRequested() {
    $('rematch').textContent = 'Прийняти реванш';
    $('rematch-note').textContent = 'Суперник хоче реванш!';
  },

  opponentLeft() {
    if (!$('result').classList.contains('hidden')) {
      $('rematch').disabled = true;
      $('rematch').textContent = 'Реванш';
      // Якщо матч і так завершився через вихід суперника, про це вже сказано над рахунком.
      $('rematch-note').textContent = $('verdict-note').textContent ? '' : 'Суперник пішов';
    } else if (!$('lobby').classList.contains('hidden')) {
      showLobbyMenu();
    }
  },
};

function onMessage(msg) {
  const h = Object.hasOwn(handlers, msg.t) ? handlers[msg.t] : null;
  if (h) h(msg);
}

// ===== Дрібниці UI =====
function fitToWindow() {
  const s = Math.min(1, (innerHeight - 40) / 844, (innerWidth - 40) / 390);
  $('stage').style.transform = `scale(${s})`;
}

function tickClock() {
  const d = new Date();
  $('clock').textContent = `${d.getHours()}:${String(d.getMinutes()).padStart(2, '0')}`;
}

function setTimer(left) {
  const frac = Math.max(0, left) / MatchRules.questionTime;
  const fill = $('timer-fill');
  fill.style.width = `${frac * 100}%`;
  fill.style.background = frac > 0.5 ? 'var(--good)' : frac > 0.25 ? 'var(--gold)' : 'var(--bad)';
  $('timer-num').textContent = Math.ceil(Math.max(0, left));
}

function floatGain(anchor, points) {
  if (!points) return;
  const el = document.createElement('div');
  el.className = 'gain';
  el.textContent = `+${points}`;
  const host = $('match');
  const a = anchor.getBoundingClientRect(), h = host.getBoundingClientRect();
  const scale = h.width / host.offsetWidth;
  el.style.left = `${(a.left - h.left) / scale}px`;
  el.style.top = `${(a.bottom - h.top) / scale + 2}px`;
  host.appendChild(el);
  setTimeout(() => el.remove(), 1500);
}

function renderLengthPicker() {
  const box = $('length-picker');
  box.innerHTML = '';
  for (const n of MatchRules.matchLengths) {
    const b = document.createElement('button');
    b.textContent = `${n} питань`;
    b.classList.toggle('on', n === matchLength);
    b.onclick = () => { matchLength = n; store.set(LENGTH_KEY, n); renderLengthPicker(); };
    box.appendChild(b);
  }
  $('rules-count').textContent = `${matchLength} питань`;
}

async function init() {
  $('name-input').value = store.get(NAME_KEY, '');
  $('name-input').addEventListener('input', () => store.set(NAME_KEY, $('name-input').value));
  renderLengthPicker();

  $('play-bot').onclick = startBotMatch;
  $('play-online').onclick = showLobby;

  $('lobby-back').onclick = () => { endSession(); show('home'); };
  $('quick').onclick = () => { showLobbyWait({ text: 'Підключаємось…' }); goOnline({ t: 'quick', length: matchLength }); };
  $('create').onclick = () => { showLobbyWait({ text: 'Створюємо кімнату…' }); goOnline({ t: 'create', length: matchLength }); };
  const join = () => {
    const code = $('code-input').value.trim().toUpperCase();
    if (code.length !== 4) { $('lobby-status').textContent = 'Код кімнати — 4 символи'; return; }
    showLobbyWait({ text: 'Підключаємось…' });
    goOnline({ t: 'join', code });
  };
  $('join').onclick = join;
  $('code-input').addEventListener('keydown', e => { if (e.key === 'Enter') join(); });
  $('cancel-wait').onclick = () => { endSession(); showLobbyMenu(); };
  $('bot-instead').onclick = startBotMatch;

  $('rematch').onclick = () => {
    if (session?.kind === 'online') {
      $('rematch').disabled = true;
      $('rematch-note').textContent = 'Чекаємо на суперника…';
    }
    session?.send({ t: 'rematch' });
  };
  $('to-home').onclick = () => { endSession(); show('home'); };

  fitToWindow();
  addEventListener('resize', fitToWindow);
  tickClock();
  setInterval(tickClock, 10000);

  try {
    const r = await fetch('../KinoBattleApp/questions.json', { cache: 'no-store' });
    if (!r.ok) throw new Error(`HTTP ${r.status}`);
    bank = await r.json();
  } catch (e) {
    $('home').innerHTML = `<div class="error"><b>Не вдалося завантажити questions.json</b>
      Запусти сервер (VS Code: завдання «Preview: запустити сервер») і відкрий http://localhost:5180/preview/<br><br>${e.message}</div>`;
  }
}
init();
</script>
